<!DOCTYPE html>
<html>
<head>
<title>DOTE Diploma CGPA Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>DOTE Diploma Lateral Entry CGPA Calculator</h1>

<div class="box">

<select id="sem">
<option value="3">Semester 3</option>
<option value="4">Semester 4</option>
<option value="5">Semester 5</option>
<option value="6">Semester 6</option>
</select>

<input id="subject" placeholder="Subject Name">
<input id="credit" type="number" placeholder="Credit">
<input id="grade" type="number" placeholder="Grade Point">

<button onclick="addSubject()">Add Subject</button>

</div>


<table>
<thead>
<tr>
<th>Semester</th>
<th>Subject</th>
<th>Credit</th>
<th>Grade Point</th>
<th>Credit Point</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>


<button onclick="calculateCGPA()">Calculate CGPA</button>

<h2 id="result"></h2>


<script src="script.js"></script>

</body>
</html>
